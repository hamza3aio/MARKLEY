<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — Markley</title>
<link rel="stylesheet" href="/css/design-system.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><span class="brand-mark">M</span> Markley</div></div></header>
<main class="container" style="max-width:480px;padding:32px 16px">
<div class="card"><h1 style="margin-top:0">Reset password</h1><div id="msg"></div>
<form id="f" class="form">
<label class="field">Email<input class="input" id="email" type="email" required></label>
<button class="btn" type="submit">Send reset link</button>
</form>
<p style="font-size:14px"><a href="/login.html">Back to sign in</a></p></div>
</main>
<script type="module">
import { getSupabase } from '/js/supabase-client.js';
import { initTheme } from '/js/app.js';
initTheme();
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const sb = await getSupabase();
  const { error } = await sb.auth.resetPasswordForEmail(document.getElementById('email').value.trim(), {
    redirectTo: location.origin + '/login.html',
  });
  document.getElementById('msg').innerHTML = error
    ? '<div class="alert error">Something went wrong. Please try again.</div>'
    : '<div class="alert ok">If the email exists, a reset link was sent.</div>';
});
</script>
</body>
</html>
