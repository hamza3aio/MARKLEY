<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — Markley</title>
<link rel="stylesheet" href="/css/design-system.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><span class="brand-mark">M</span> Markley</div></div></header>
<main class="container" style="max-width:480px;padding:32px 16px">
<div class="card">
<h1 style="margin-top:0">Create pending account</h1>
<div id="err"></div><div id="ok"></div>
<form id="f" class="form" onsubmit="return window.__markleyLoginReady === true">
<label class="field">Full name<input class="input" id="name" required maxlength="120" autocomplete="name"></label>
<label class="field">Email<input class="input" id="email" type="email" required autocomplete="email"></label>
<label class="field">Password<input class="input" id="pw" type="password" required minlength="8" autocomplete="new-password"></label>
<button class="btn" id="btn" type="submit">Create account</button>
</form>
<p style="color:var(--muted);font-size:14px">You will receive a verification email. After verifying, an admin must activate your account and assign the correct role before you can access dashboards.</p>
<p style="font-size:14px"><a href="/login.html">Back to sign in</a></p>
</div>
</main>
<div id="toasts"></div>
<script>
window.__markleyLoginReady = false;
setTimeout(function () {
  if (!window.__markleyLoginReady) {
    document.getElementById('err').innerHTML = '<div class="alert error">Scripts failed to load. Reload the page — if it persists, press F12, open Console, and send the red error text.</div>';
  }
}, 6000);
</script>
<script type="module">
import { signUp } from '/js/auth.js';
import { toast } from '/js/ui.js';
import { initTheme } from '/js/app.js';
initTheme();
window.__markleyLoginReady = true;
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  btn.disabled = true;
  try {
    await signUp(
      document.getElementById('name').value,
      document.getElementById('email').value,
      document.getElementById('pw').value
    );
    document.getElementById('ok').innerHTML = '<div class="alert ok">Check your email to verify, then wait for admin activation.</div>';
  } catch (err) {
    document.getElementById('err').innerHTML = `<div class="alert error">${err.message}</div>`;
    toast(err.message);
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
