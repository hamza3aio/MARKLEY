<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Markley</title>
<link rel="stylesheet" href="/css/design-system.css">
<link rel="stylesheet" href="/css/layout.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner">
<div class="brand"><span class="brand-mark">M</span> Markley</div>
</div></header>
<main class="container" style="max-width:480px;padding:32px 16px">
<div class="card">
<h1 style="margin-top:0">Sign in</h1>
<div id="err"></div>
<form id="loginForm" class="form" onsubmit="return window.__markleyLoginReady === true">
<label class="field">Email<input class="input" id="email" type="email" required autocomplete="email"></label>
<label class="field">Password<input class="input" id="password" type="password" required autocomplete="current-password"></label>
<button class="btn" type="submit" id="btn">Sign in</button>
</form>
<p style="color:var(--muted);font-size:14px">Students join by invitation only. New public sign-ups create a <b>pending</b> account requiring email verification and admin activation.</p>
<p style="font-size:14px"><a href="/signup.html">Create pending account</a> · <a href="/reset.html">Forgot password?</a></p>
</div>
</main>
<div id="toasts"></div>
<script>
window.__markleyLoginReady = false;
setTimeout(function () {
  if (!window.__markleyLoginReady) {
    document.getElementById('err').innerHTML = '<div class="alert error">Sign-in scripts failed to load (network or ad-blocker blocking the login libraries?). Reload the page — if it persists, press F12, open Console, and send the red error text.</div>';
  }
}, 6000);
</script>
<script type="module">
import { signIn } from '/js/auth.js';
import { getSupabase } from '/js/supabase-client.js';
import { toast } from '/js/ui.js';
import { initTheme } from '/js/app.js';
initTheme();
function safeNext() {
  const n = new URLSearchParams(location.search).get('next') || '/dashboard.html';
  return n.startsWith('/') && !n.startsWith('//') ? n : '/dashboard.html';
}
getSupabase().then(async (sb) => {
  const { data } = await sb.auth.getSession();
  if (data.session) location.href = safeNext();
}).catch((err) => {
  document.getElementById('err').innerHTML = `<div class="alert error">${err.message}</div>`;
});
window.__markleyLoginReady = true;
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  btn.disabled = true;
  try {
    const session = await signIn(
      document.getElementById('email').value,
      document.getElementById('password').value
    );
    await fetch('/api/activity', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
      body: JSON.stringify({ action: 'login' }),
    }).catch(() => {});
    location.href = safeNext();
  } catch (err) {
    document.getElementById('err').innerHTML = `<div class="alert error">${err.message}</div>`;
    toast(err.message);
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
